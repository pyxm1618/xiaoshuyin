name: Stage A Exact-Head Cold Boot

on:
  pull_request:
    branches: [main]

jobs:
  cold-boot:
    runs-on: ubuntu-latest
    env:
      POSTGRES_SUPERUSER_PASSWORD: postgres
      POSTGRES_MIGRATOR_PASSWORD: stage_a_migrator_pw
      POSTGRES_APP_PASSWORD: stage_a_app_pw
      SESSION_SECRET: stage-a-session-secret-fixture
      EVIDENCE_HASH_PEPPER: stage-a-evidence-pepper-fixture-32bytes
      WECHAT_APP_ID: stage-a-app-id
      WECHAT_APP_SECRET: stage-a-app-secret
      IDENTITY_BINDING_SECRET: stage-a-identity-binding-secret-fixture-32chars
      IDENTITY_BINDING_CONTEXT_TTL_SECONDS: "600"
      IDENTITY_BINDING_ATTEMPT_TTL_SECONDS: "900"
      IDENTITY_BINDING_PAIRING_TTL_SECONDS: "300"
      PARTICIPATION_INVITE_TTL_SECONDS: "86400"
      PARTICIPATION_INVITE_TOKEN_SECRET: stage-a-participation-token-secret-fixture-32chars
    steps:
      - name: Checkout remediation exact head
        uses: actions/checkout@v4
        with:
          ref: 8387718c3159758300550321adb61633a8c940a4
      - name: Fresh reset
        run: docker compose -f docker-compose.stage-a.yml down -v --remove-orphans
      - name: Render configuration
        run: docker compose -f docker-compose.stage-a.yml config
      - name: Build Stage A images
        run: docker compose -f docker-compose.stage-a.yml build
      - name: Start fresh PostgreSQL
        run: docker compose -f docker-compose.stage-a.yml up -d postgres
      - name: Wait for PostgreSQL health
        run: |
          for i in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.stage-a.yml ps -q postgres)" 2>/dev/null || true)"
            if [ "$state" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.stage-a.yml logs --no-color postgres
          exit 1
      - name: Run shipped migration executable
        run: docker compose -f docker-compose.stage-a.yml run --rm api node dist/migrate.js
      - name: Verify latest migration and role repair
        run: |
          docker compose -f docker-compose.stage-a.yml exec -T postgres             psql -U postgres -d xiaoshuyin -Atc             "SELECT CASE WHEN EXISTS (
               SELECT 1 FROM schema_migrations
                WHERE filename='039_final_bounded_remediation.sql'
             ) THEN 'PASS' ELSE 'FAIL' END" | grep '^PASS$'
          docker compose -f docker-compose.stage-a.yml exec -T postgres             psql -U postgres -d xiaoshuyin -Atc             "SELECT has_schema_privilege('xiaoshuyin_app','public','CREATE')" | grep '^f$'
      - name: Start API
        run: docker compose -f docker-compose.stage-a.yml up -d api
      - name: Verify API remains running and healthz succeeds
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/healthz | grep -q '"status":"ok"'; then
              docker compose -f docker-compose.stage-a.yml ps -a
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.stage-a.yml ps -a
          docker compose -f docker-compose.stage-a.yml logs --no-color api postgres
          exit 1
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.stage-a.yml down -v --remove-orphans
