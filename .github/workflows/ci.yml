name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '26.13.0'

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Static guard
        run: bun run guard:static

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Run unit tests
        run: bunx vitest run tests/domain
      - name: Run Digital Use Scene foundation tests
        run: bunx vitest run tests/scenes/digital-use

  db-migrate:
    name: DB Migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xiaoshuyin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Bootstrap roles
        run: bash db/init/01-roles.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: xiaoshuyin_test
          POSTGRES_MIGRATOR_PASSWORD: ci_migrator_pw
          POSTGRES_APP_PASSWORD: ci_app_pw
      - name: Bootstrap pgvector
        run: bash db/init/02-pgvector.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: xiaoshuyin_test
      - name: Run migrations
        run: bun run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgres://xiaoshuyin_migrator:ci_migrator_pw@localhost:5432/xiaoshuyin_test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [static, db-migrate]
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xiaoshuyin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # exact-final-head provenance needs origin/main (not a depth-1 clone).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Bootstrap roles
        run: bash db/init/01-roles.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: xiaoshuyin_test
          POSTGRES_MIGRATOR_PASSWORD: ci_migrator_pw
          POSTGRES_APP_PASSWORD: ci_app_pw
      - name: Bootstrap pgvector
        run: bash db/init/02-pgvector.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: xiaoshuyin_test
      - name: Run migrations
        run: bun run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgres://xiaoshuyin_migrator:ci_migrator_pw@localhost:5432/xiaoshuyin_test
      # MEDIUM-04: the canonical verify-all runs on the exact checked-out Head
      # and writes its complete provenance/output to an Actions artifact.
      - name: Run canonical verify-all
        run: |
          set -o pipefail
          node scripts/verify-all.mjs 2>&1 | tee "$RUNNER_TEMP/verify-all.log"
        env:
          DATABASE_URL: postgres://xiaoshuyin_app:ci_app_pw@localhost:5432/xiaoshuyin_test
          MIGRATION_DATABASE_URL: postgres://xiaoshuyin_migrator:ci_migrator_pw@localhost:5432/xiaoshuyin_test
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xiaoshuyin_test
          IDENTITY_BINDING_SECRET: ci-identity-binding-secret-fixture-32chars
          IDENTITY_BINDING_CONTEXT_TTL_SECONDS: '600'
          IDENTITY_BINDING_ATTEMPT_TTL_SECONDS: '900'
          IDENTITY_BINDING_PAIRING_TTL_SECONDS: '300'
          PARTICIPATION_INVITE_TTL_SECONDS: '86400'
          PARTICIPATION_INVITE_TOKEN_SECRET: ci-participation-invite-secret-32chars
          PGVECTOR_STAGE: STAGE_A
          PGVECTOR_ENVIRONMENT_KIND: CI_INTEGRATION
          PGVECTOR_ENVIRONMENT_ID: 'github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}:integration'
          PGVECTOR_REPOSITORY_COMMIT: ${{ github.sha }}
          PGVECTOR_IMAGE_REF: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
          PGVECTOR_EXPECTED_VERSION: '0.8.7'
          PGVECTOR_READINESS_EVIDENCE: ${{ runner.temp }}/pgvector-readiness.json
          COVERAGE_EXECUTION_EVIDENCE: ${{ runner.temp }}/vitest-results.json
      - name: Upload verify-all provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-all-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify-all.log
            ${{ runner.temp }}/vitest-results.json
            ${{ runner.temp }}/pgvector-readiness.json
          if-no-files-found: warn
          retention-days: 90

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: OpenAPI generate + check
        run: |
          bun run openapi:generate
          bun run openapi:check
      - name: Verify generated OpenAPI client is committed
        run: |
          git diff --exit-code -- packages/generated/openapi.json packages/generated/openapi.d.ts
