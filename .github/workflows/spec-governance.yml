name: Spec Governance

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  governance:
    name: Xiaoshuyin spec traceability gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Validate governance artifacts and feature traceability
        run: node .specify/scripts/validate-governance.mjs
