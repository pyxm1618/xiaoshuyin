name: Spec Governance

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  governance:
    name: Spec Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for exact PR/base diff and ancestry evidence.
          fetch-depth: 0

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Validate implementation binding, authority convergence, and task evidence
        env:
          GOVERNANCE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          node .specify/scripts/validate-change-governance.mjs \
            --base "$GOVERNANCE_BASE" \
            --head HEAD

      - name: Validate historical task evidence provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .specify/scripts/validate-task-evidence-remote.mjs

      - name: Validate governance artifacts and feature traceability
        run: node .specify/scripts/validate-governance.mjs

      - name: Governance self-tests
        run: |
          node .specify/scripts/tests/run-governance-tests.mjs
          node .specify/scripts/tests/run-change-governance-tests.mjs
