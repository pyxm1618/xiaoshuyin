name: Slice 3 Remediation Verify

on:
  push:
    branches: ['feat/003-evidence-core']

env:
  NODE_VERSION: '26.13.0'

jobs:
  verify:
    name: Targeted + Full Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xiaoshuyin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://xiaoshuyin_app:ci_app_pw@localhost:5432/xiaoshuyin_test
      MIGRATION_DATABASE_URL: postgres://xiaoshuyin_migrator:ci_migrator_pw@localhost:5432/xiaoshuyin_test
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/xiaoshuyin_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Bootstrap roles
        run: bash db/init/01-roles.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: xiaoshuyin_test
          POSTGRES_MIGRATOR_PASSWORD: ci_migrator_pw
          POSTGRES_APP_PASSWORD: ci_app_pw
      - name: Fresh migration replay
        run: |
          bun run db:migrate
          bun run db:migrate
      - name: Four findings + frozen-boundary targeted tests
        run: |
          bunx vitest run \
            tests/db/evidence-raw-writer-guard.test.ts \
            tests/integration/evidence-write.test.ts \
            tests/integration/messages-create.test.ts \
            tests/integration/messages-authorization-error-classification.test.ts \
            tests/integration/messages-idempotency.test.ts \
            tests/integration/messages-authorization-before-replay.test.ts \
            tests/domain/package-boundary.test.ts \
            tests/domain/evidence-provenance.test.ts \
            tests/domain/evidence-person-reference.test.ts \
            tests/db/evidence-fact-guard.test.ts \
            tests/db/evidence-rls-grants.test.ts \
            tests/db/evidence-conflict-concurrency.test.ts \
            tests/db/migration-upgrade-evidence.test.ts
      - name: Coverage audit
        run: bun run coverage:audit
      - name: Governance
        run: |
          node .specify/scripts/validate-governance.mjs
          node .specify/scripts/tests/run-governance-tests.mjs
      - name: Verify all
        run: bun run verify-all
