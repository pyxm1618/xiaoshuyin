openapi: 3.1.0
info:
  title: Xiaoshuyin V1 — Identity Binding Runtime API
  version: 0.1.0-plan
tags:
  - name: identity-binding
paths:
  /api/v1/identity-bindings/bootstrap:
    post:
      tags: [identity-binding]
      operationId: bootstrapIdentityBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingBootstrapRequest'
      responses:
        '200':
          description: generic / Case B 复用 / COMMITTED settled replay
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BindingBootstrapGenericResponse'
                  - $ref: '#/components/schemas/BindingBootstrapReusedResponse'
                  - $ref: '#/components/schemas/BindingBootstrapCommittedResponse'
        '401':
          description: WeChat authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency payload mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity-bindings/candidate-decision:
    post:
      tags: [identity-binding]
      operationId: submitCandidateBindingDecision
      parameters:
        - $ref: '#/components/parameters/BindingContextHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingCandidateDecisionRequest'
      responses:
        '200':
          description: 统一 generic 结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingGenericResponse'
        '401':
          description: Binding context invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingContextInvalidError'
        '409':
          description: Idempotency payload mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity-bindings/status:
    get:
      tags: [identity-binding]
      operationId: getCandidateBindingStatus
      parameters:
        - $ref: '#/components/parameters/BindingContextHeader'
      responses:
        '200':
          description: candidate 可见状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingStatusResponse'
        '401':
          description: Binding context invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingContextInvalidError'
  /api/v1/identity-bindings/session:
    post:
      tags: [identity-binding]
      operationId: exchangeBindingSession
      parameters:
        - $ref: '#/components/parameters/BindingContextHeader'
      responses:
        '200':
          description: 未 COMMITTED generic / COMMITTED 普通会话
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BindingGenericResponse'
                  - $ref: '#/components/schemas/BindingSessionCommittedResponse'
        '401':
          description: Binding context invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingContextInvalidError'
  /api/v1/identity-bindings/pending:
    get:
      tags: [identity-binding]
      operationId: listPendingBindings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BindingPersonIdQuery'
      responses:
        '200':
          description: 最小 attempts 列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingPendingListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Binding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingNotFoundError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity-bindings/{attemptId}/decision:
    post:
      tags: [identity-binding]
      operationId: submitSecondPartyBindingDecision
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BindingAttemptIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingConfirmerDecisionRequest'
      responses:
        '200':
          description: 确认后 attempt 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingConfirmerDecisionResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Binding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindingNotFoundError'
        '409':
          description: State conflict / idempotency mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    BindingContextHeader:
      name: X-Binding-Context
      in: header
      required: true
      description: opaque pending authentication context；不是普通会话。
      schema:
        type: string
    BindingPersonIdQuery:
      name: personId
      in: query
      required: true
      description: 待验证的 target Person P1；服务端读取唯一 Family。
      schema:
        type: string
        format: uuid
    BindingAttemptIdPath:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    BindingBootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        invitationToken:
          type: string
        idempotencyKey:
          type: string
      required: [code, invitationToken, idempotencyKey]
    BindingCandidateDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [AFFIRM, REJECT, CANCEL]
        confirmationVersion:
          type: [string, 'null']
          const: candidate-binding-v1
        idempotencyKey:
          type: string
      required: [decision, idempotencyKey]
    BindingConfirmerDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [AFFIRM, REJECT]
        targetConfirmed:
          type: boolean
        candidateRecognized:
          type: boolean
        confirmationVersion:
          type: string
          const: second-party-recognition-v1
        idempotencyKey:
          type: string
      required:
        - personId
        - decision
        - targetConfirmed
        - candidateRecognized
        - confirmationVersion
        - idempotencyKey
    BindingGenericResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          const: NOT_COMPLETED
      required: [binding]
    BindingBootstrapGenericResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          const: NOT_COMPLETED
        pendingContextToken:
          type: string
      required: [binding, pendingContextToken]
    BindingBootstrapReusedResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          const: REUSED
        sessionToken:
          type: string
        account:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
          required: [id]
        person:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
          required: [id]
      required: [binding, sessionToken, account, person]
    BindingBootstrapCommittedResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          const: COMMITTED
      required: [binding]
    BindingStatusResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          enum: [NOT_COMPLETED, COMMITTED]
      required: [binding]
    BindingSessionCommittedResponse:
      type: object
      additionalProperties: false
      properties:
        binding:
          type: string
          const: COMMITTED
        sessionToken:
          type: string
        account:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
          required: [id]
        person:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
          required: [id]
      required: [binding, sessionToken, account, person]
    BindingPendingListResponse:
      type: object
      additionalProperties: false
      properties:
        attempts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              attemptId:
                type: string
                format: uuid
              createdAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
            required: [attemptId, createdAt, expiresAt]
      required: [attempts]
    BindingConfirmerDecisionResponse:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [PENDING, COMMITTED, TERMINAL]
      required: [state]
    BindingNotFoundError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          const: BINDING_NOT_FOUND
        message:
          type: string
      required: [code, message]
    BindingContextInvalidError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          const: BINDING_CONTEXT_INVALID
        message:
          type: string
      required: [code, message]