openapi: 3.1.0
info:
  title: Xiaoshuyin Slice 3 Message Contract
  version: 0.1.0
paths:
  /api/v1/cases/{id}/messages:
    post:
      operationId: createCaseMessage
      summary: Record one raw message in an existing Case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseMessageRequest'
      responses:
        '201':
          description: Message recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMessageResponse'
        '401':
          description: Unauthenticated
        '404':
          description: Case not found or not visible to current actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseNotFound'
        '409':
          description: Idempotency payload mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyPayloadMismatch'
        '422':
          description: Validation error
components:
  schemas:
    CreateCaseMessageRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, content]
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        content:
          type: string
          minLength: 1
    CaseMessageResponse:
      type: object
      additionalProperties: false
      required: [id, caseId, authorPersonId, content, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        authorPersonId:
          type: string
          format: uuid
        content:
          type: string
        recordedAt:
          type: string
          format: date-time
    CaseNotFound:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          const: CASE_NOT_FOUND
        message:
          type: string
    IdempotencyPayloadMismatch:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          const: IDEMPOTENCY_PAYLOAD_MISMATCH
        message:
          type: string
