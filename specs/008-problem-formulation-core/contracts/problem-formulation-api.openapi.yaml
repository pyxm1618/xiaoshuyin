openapi: 3.0.3
info:
  title: Xiaoshuyin — Slice 8 Problem Formulation Core
  version: 1.0.0-plan
  description: >-
    Planning-stage frozen-contract candidate for independent pre-development audit.
    It defines only the four public Problem Formulation operations approved by
    the frozen Slice 8 Spec. StartAssessment, PresentProblemFormulation and
    ReassessFromFormulation are intentionally absent because they are internal commands.
paths:
  /api/v1/cases/{id}/problem-formulations/current:
    get:
      tags: [case]
      operationId: getCurrentProblemFormulation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Current Problem Formulation, or a true empty state for an authorized Case
          headers:
            ETag:
              $ref: '#/components/headers/CaseVersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationCurrentResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
        '404':
          description: CURRENT_FAMILY_NOT_FOUND / CASE_NOT_FOUND
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentFamilyNotFoundError'
                  - $ref: '#/components/schemas/CaseNotFoundError'
        '409':
          description: CURRENT_FAMILY_AMBIGUOUS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentFamilyAmbiguousError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'

  /api/v1/cases/{id}/problem-formulations/{version}/confirm:
    post:
      tags: [case]
      operationId: confirmProblemFormulation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FormulationVersion'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchCaseVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemFormulationResponseRequest'
      responses:
        '200':
          description: Formulation confirmed and Case advanced to GOALS
          headers:
            ETag:
              $ref: '#/components/headers/CaseVersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationCurrentResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
        '404':
          description: CURRENT_FAMILY_NOT_FOUND / CASE_NOT_FOUND
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentFamilyNotFoundError'
                  - $ref: '#/components/schemas/CaseNotFoundError'
        '409':
          description: State, version, dependency, primary, Safety, Closed, Family ambiguity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationConflictError'
        '422':
          description: Strict request validation or Evidence fidelity failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationValidationError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'

  /api/v1/cases/{id}/problem-formulations/{version}/dispute:
    post:
      tags: [case]
      operationId: disputeProblemFormulation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FormulationVersion'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchCaseVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemFormulationResponseRequest'
      responses:
        '200':
          description: Formulation disputed; Case remains in PROBLEM_FORMULATION
          headers:
            ETag:
              $ref: '#/components/headers/CaseVersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationCurrentResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
        '404':
          description: CURRENT_FAMILY_NOT_FOUND / CASE_NOT_FOUND
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentFamilyNotFoundError'
                  - $ref: '#/components/schemas/CaseNotFoundError'
        '409':
          description: State, version, primary, Safety, Closed, Family ambiguity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationConflictError'
        '422':
          description: Strict request validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationValidationError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'

  /api/v1/cases/{id}/problem-formulations/{version}/corrections:
    post:
      tags: [case]
      operationId: correctProblemFormulation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/FormulationVersion'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchCaseVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemFormulationCorrectionRequest'
      responses:
        '201':
          description: Complete corrected formulation version created; old version superseded
          headers:
            ETag:
              $ref: '#/components/headers/CaseVersionETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationCurrentResponse'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
        '404':
          description: CURRENT_FAMILY_NOT_FOUND / CASE_NOT_FOUND
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CurrentFamilyNotFoundError'
                  - $ref: '#/components/schemas/CaseNotFoundError'
        '409':
          description: State, version, primary, Safety, Closed, Family ambiguity or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationConflictError'
        '422':
          description: Empty/no-op correction, strict schema, or full merged-formulation fidelity failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemFormulationValidationError'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FormulationVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Existing shared command idempotency key. Same key + same canonical payload replays the original result; same key + different payload returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128

    IfMatchCaseVersionHeader:
      name: If-Match
      in: header
      required: true
      description: Transport representation of the existing cases.version optimistic-concurrency token. It is not a second business version. Runtime must parse the decimal payload and reject values outside 1..2147483647 before repository/SQL access; the regex is only a lexical gate.
      schema:
        type: string
        pattern: '^"case-v[1-9][0-9]{0,9}"$'
        example: '"case-v12"'

  headers:
    CaseVersionETag:
      description: ETag derived only from the current PostgreSQL-integer cases.version (1..2147483647).
      schema:
        type: string
        pattern: '^"case-v[1-9][0-9]{0,9}"$'
        example: '"case-v13"'

  schemas:
    ProblemFormulationStatus:
      type: string
      enum:
        - DRAFT
        - PRESENTED
        - CONFIRMED
        - DISPUTED
        - NEEDS_REVIEW
        - SUPERSEDED

    EvidenceRef:
      oneOf:
        - $ref: '#/components/schemas/DialogueMessageRef'
        - $ref: '#/components/schemas/AssertionRef'
        - $ref: '#/components/schemas/ObservationRef'

    DialogueMessageRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [DIALOGUE_MESSAGE]
        id:
          type: string
          format: uuid
      required: [type, id]

    AssertionRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [ASSERTION]
        id:
          type: string
          format: uuid
      required: [type, id]

    ObservationRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [OBSERVATION]
        id:
          type: string
          format: uuid
      required: [type, id]

    PrimaryProblem:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required: [text, evidenceRefs]

    KeyFactor:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required: [text, evidenceRefs]

    UnknownItem:
      type: object
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 1
        state:
          type: string
          enum: [UNKNOWN, NOT_COLLECTED, DECLINED]
        evidenceRefs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required: [topic, state, evidenceRefs]

    ConflictItem:
      type: object
      additionalProperties: false
      properties:
        topic:
          type: string
          minLength: 1
        conflictGroupId:
          type: string
          format: uuid
        evidenceRefs:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceRef'
      required: [topic]
      anyOf:
        - required: [conflictGroupId]
        - required: [evidenceRefs]
          properties:
            evidenceRefs:
              minItems: 2
      description: >-
        Either conflictGroupId is present and the server resolver proves at least
        two real conflicting sides, or conflictGroupId is absent and evidenceRefs
        contains at least two distinct refs. If both are present, domain validation
        must prove every explicit ref is consistent with the resolved group.

    TextCondition:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
      required: [text]

    UserResponse:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [CONFIRM, DISPUTE, CORRECTION]
        actorPersonId:
          type: string
          format: uuid
        respondedAt:
          type: string
          format: date-time
        note:
          type: string
          minLength: 1
      required: [kind, actorPersonId, respondedAt]

    EvidenceDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [EVIDENCE]
        evidence:
          $ref: '#/components/schemas/EvidenceRef'
      required: [type, evidence]

    ConsentDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [CONSENT]
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
      required: [type, id]

    VersionedKeyDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [POLICY, PACKAGE, CONTENT_VERSION]
        key:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      required: [type, key, version]

    DependencyRef:
      oneOf:
        - $ref: '#/components/schemas/EvidenceDependencyRef'
        - $ref: '#/components/schemas/ConsentDependencyRef'
        - $ref: '#/components/schemas/VersionedKeyDependencyRef'

    ProblemFormulationContent:
      type: object
      additionalProperties: false
      properties:
        primaryProblem:
          $ref: '#/components/schemas/PrimaryProblem'
        keyFactors:
          type: array
          items:
            $ref: '#/components/schemas/KeyFactor'
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRef'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/UnknownItem'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        sceneFit:
          type: string
          minLength: 1
        alternativeExplanations:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        reassessmentConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        exitConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        dependencyRefs:
          type: array
          items:
            $ref: '#/components/schemas/DependencyRef'
      required:
        - primaryProblem
        - keyFactors
        - evidenceRefs
        - unknowns
        - conflicts
        - sceneFit
        - alternativeExplanations
        - reassessmentConditions
        - exitConditions
        - dependencyRefs

    ProblemFormulation:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        status:
          $ref: '#/components/schemas/ProblemFormulationStatus'
        primaryProblem:
          $ref: '#/components/schemas/PrimaryProblem'
        keyFactors:
          type: array
          items:
            $ref: '#/components/schemas/KeyFactor'
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRef'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/UnknownItem'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        sceneFit:
          type: string
          minLength: 1
        alternativeExplanations:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        reassessmentConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        exitConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        userResponse:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserResponse'
        confirmedBy:
          type: string
          format: uuid
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        dependencyRefs:
          type: array
          items:
            $ref: '#/components/schemas/DependencyRef'
        supersedesVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - caseId
        - version
        - status
        - primaryProblem
        - keyFactors
        - evidenceRefs
        - unknowns
        - conflicts
        - sceneFit
        - alternativeExplanations
        - reassessmentConditions
        - exitConditions
        - userResponse
        - confirmedBy
        - confirmedAt
        - dependencyRefs
        - supersedesVersion
        - createdAt
        - updatedAt

    ProblemFormulationCurrentResponse:
      type: object
      additionalProperties: false
      properties:
        caseVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
        current:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProblemFormulation'
      required: [caseVersion, current]

    ProblemFormulationResponseRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1

    ProblemFormulationContentChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        primaryProblem:
          $ref: '#/components/schemas/PrimaryProblem'
        keyFactors:
          type: array
          items:
            $ref: '#/components/schemas/KeyFactor'
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvidenceRef'
        unknowns:
          type: array
          items:
            $ref: '#/components/schemas/UnknownItem'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictItem'
        sceneFit:
          type: string
          minLength: 1
        alternativeExplanations:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        reassessmentConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        exitConditions:
          type: array
          items:
            $ref: '#/components/schemas/TextCondition'
        dependencyRefs:
          type: array
          items:
            $ref: '#/components/schemas/DependencyRef'

    ProblemFormulationCorrectionRequest:
      type: object
      additionalProperties: false
      properties:
        changes:
          $ref: '#/components/schemas/ProblemFormulationContentChanges'
        note:
          type: string
          minLength: 1
      required: [changes]

    UnauthenticatedError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED]
        message:
          type: string
      required: [code, message]

    CurrentFamilyNotFoundError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [CURRENT_FAMILY_NOT_FOUND]
        message:
          type: string
      required: [code, message]

    CaseNotFoundError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [CASE_NOT_FOUND]
        message:
          type: string
      required: [code, message]

    CurrentFamilyAmbiguousError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [CURRENT_FAMILY_AMBIGUOUS]
        message:
          type: string
      required: [code, message]

    ProblemFormulationConflictError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - CURRENT_FAMILY_AMBIGUOUS
            - IDEMPOTENCY_PAYLOAD_MISMATCH
            - CASE_NOT_PRIMARY
            - CASE_PHASE_CONFLICT
            - STALE_CASE_VERSION
            - CASE_CLOSED
            - SAFETY_HOLD_BLOCKED
            - PROBLEM_FORMULATION_VERSION_CONFLICT
            - PROBLEM_FORMULATION_STATE_CONFLICT
            - PROBLEM_FORMULATION_DEPENDENCY_INVALID
        message:
          type: string
      required: [code, message]

    ProblemFormulationValidationError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - PROBLEM_FORMULATION_EVIDENCE_INVALID
        message:
          type: string
      required: [code, message]

    InternalError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [INTERNAL_ERROR]
        message:
          type: string
      required: [code, message]
