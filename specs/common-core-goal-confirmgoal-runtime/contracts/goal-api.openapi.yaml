openapi: 3.1.0
info:
  title: Xiaoshuyin V1 — Common Core Goal / ConfirmGoal Runtime API
  version: 1.0.0
paths:
  /api/v1/cases/{id}/goals:
    post:
      operationId: mutateGoal
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/IfMatchCaseVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    operation:
                      type: string
                      const: SAVE
                    problemFormulationId:
                      type: string
                      format: uuid
                    problemFormulationVersion:
                      type: integer
                      minimum: 1
                      maximum: 2147483647
                    baselineRefs:
                      type: array
                      minItems: 1
                      items:
                        $ref: '#/components/schemas/EvidenceRef'
                    targetDescription:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    observationMethod:
                      type: string
                      minLength: 1
                      maxLength: 4000
                    observationWindow:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    protectiveConditions:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
                    parentActions:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                        maxLength: 2000
                    reviewPoint:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    dependencyRefs:
                      type: array
                      minItems: 1
                      items:
                        $ref: '#/components/schemas/GoalDependencyRef'
                    participantResponsibilities:
                      type: array
                      default: []
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          personId:
                            type: string
                            format: uuid
                          responsibility:
                            type: string
                            minLength: 1
                            maxLength: 2000
                          evidenceRefs:
                            type: array
                            minItems: 1
                            items:
                              $ref: '#/components/schemas/EvidenceRef'
                        required:
                          - personId
                          - responsibility
                          - evidenceRefs
                  required:
                    - operation
                    - problemFormulationId
                    - problemFormulationVersion
                    - baselineRefs
                    - targetDescription
                    - observationMethod
                    - observationWindow
                    - protectiveConditions
                    - parentActions
                    - reviewPoint
                    - dependencyRefs
                    - participantResponsibilities
                - type: object
                  additionalProperties: false
                  properties:
                    operation:
                      type: string
                      const: CONFIRM
                    goalId:
                      type: string
                      format: uuid
                    goalVersion:
                      type: integer
                      minimum: 1
                      maximum: 2147483647
                  required:
                    - operation
                    - goalId
                    - goalVersion
              discriminator:
                propertyName: operation
      responses:
        '200': { description: Exact persisted Goal version confirmed; Case advanced to PLANNING }
        '201': { description: Goal version saved; Case remains GOALS }
        '401': { description: Unauthenticated }
        '404': { description: Current Family or Case unavailable }
        '409': { description: State, authority, dependency, Safety, Consent, Compliance, version or idempotency conflict }
        '422': { description: Strict Goal request validation failure }
        '500': { description: Internal error }

components:
  parameters:
    CaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 关键命令幂等键（§8.5）。同 key 不同 payload → 409。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatchCaseVersionHeader:
      name: If-Match
      in: header
      required: true
      description: Transport representation of the existing cases.version optimistic-concurrency token. It is not a second business version. Runtime must parse the decimal payload and reject values outside 1..2147483647 before repository/SQL access; the regex is only a lexical gate.
      schema:
        type: string
        pattern: '^"case-v[1-9][0-9]{0,9}"$'
        example: '"case-v12"'
  schemas:
    DialogueMessageRef:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [DIALOGUE_MESSAGE] }
        id: { type: string, format: uuid }
      required: [type, id]
    AssertionRef:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [ASSERTION] }
        id: { type: string, format: uuid }
      required: [type, id]
    ObservationRef:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [OBSERVATION] }
        id: { type: string, format: uuid }
      required: [type, id]
    EvidenceRef:
      oneOf:
        - $ref: '#/components/schemas/DialogueMessageRef'
        - $ref: '#/components/schemas/AssertionRef'
        - $ref: '#/components/schemas/ObservationRef'
    EvidenceDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [EVIDENCE] }
        evidence:
          $ref: '#/components/schemas/EvidenceRef'
      required: [type, evidence]
    ConsentDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [CONSENT] }
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1, maximum: 2147483647 }
      required: [type, id]
    GoalDependencyRef:
      oneOf:
        - $ref: '#/components/schemas/EvidenceDependencyRef'
        - $ref: '#/components/schemas/ConsentDependencyRef'
    VersionedKeyDependencyRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [POLICY, PACKAGE, CONTENT_VERSION]
        key: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
      required: [type, key, version]
    DependencyRef:
      oneOf:
        - $ref: '#/components/schemas/EvidenceDependencyRef'
        - $ref: '#/components/schemas/ConsentDependencyRef'
        - $ref: '#/components/schemas/VersionedKeyDependencyRef'
